name: Daily rankings

# Runs the whole pipeline and commits a dated report.
#
# Nothing here falls back to stale data. If the ESPN sync fails -- expired
# cookies, ESPN being down, a roster with a player missing from the rankings --
# the job fails and commits nothing. A report built from a partial sync looks
# completely normal and is wrong, which is worse than no report at all.

on:
  schedule:
    # 12:00 UTC, roughly 8am Eastern. Late enough that overnight injury news
    # and waiver moves have landed.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Don't let a manual run collide with the scheduled one.
concurrency:
  group: daily-rankings
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[platforms]"

      - name: Pick a date
        run: echo "REPORT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Sync, rank and simulate
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          # The FantasyPros refresh is optional. Without a key the run uses the
          # committed CSV, which is three manual columns plus a stale ECR -- a
          # perfectly good report, just not a freshened one. With a key, only
          # the ECR column updates; the other three sources are manual exports
          # by design (see docs/source-investigation.md).
          refresh=""
          if [ -n "${FANTASYPROS_API_KEY}" ]; then
            refresh="--refresh-rankings"
            echo "FantasyPros key present, refreshing the ECR column"
          else
            echo "No FantasyPros key, using the committed rankings"
          fi

          fpr simulate \
            --platform espn \
            ${refresh} \
            --out "reports/${REPORT_DATE}.md" \
            --snapshot "history/${REPORT_DATE}.json"

      - name: Check the report is real
        run: |
          # Belt and braces. The CLI writes nothing on failure, but a
          # zero-byte or truncated file committed daily would be worse than a
          # loud failure.
          test -s "reports/${REPORT_DATE}.md"
          test -s "history/${REPORT_DATE}.json"
          grep -q "## Standings" "reports/${REPORT_DATE}.md"
          grep -q "## Simulation" "reports/${REPORT_DATE}.md"

      - name: Update latest
        run: cp "reports/${REPORT_DATE}.md" reports/latest.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports history
          if git diff --staged --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          git commit -m "Rankings for ${REPORT_DATE}"
          git push
