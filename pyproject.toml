[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpr"
version = "0.1.0"
description = "Slot-by-slot power rankings for a 12-team fantasy football league"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Only needed if you're syncing rosters off a platform instead of using
# config/rosters.yaml by hand.
platforms = [
    "espn-api>=0.44",
    "python-dotenv>=1.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
fpr = "fpr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
